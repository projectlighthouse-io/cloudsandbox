[package]
name = "cloudsandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
action = { git = "https://github.com/projectlighthouse-io/toolkit" }
command = { git = "https://github.com/projectlighthouse-io/toolkit", features = ["action"] }
db = { git = "https://github.com/projectlighthouse-io/toolkit", features = ["postgres"] }
route = { git = "https://github.com/projectlighthouse-io/toolkit", features = ["server", "command", "action"] }
securecookie = { git = "https://github.com/projectlighthouse-io/toolkit" }
session = { git = "https://github.com/projectlighthouse-io/toolkit", features = ["postgres", "route", "command"] }
queue = { git = "https://github.com/projectlighthouse-io/toolkit", features = ["postgres", "command"] }
event = { git = "https://github.com/projectlighthouse-io/toolkit", features = ["queue", "command"] }

clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
